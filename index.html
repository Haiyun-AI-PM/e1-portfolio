<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的作品集 | 首页</title>
  <!-- styles.css：负责页面的长相（颜色、字体、间距、布局） -->
  <link rel="stylesheet" href="styles.css" />
  <!-- script.js：负责页面的行为（交互、动态内容），defer 保证 DOM 就绪后再执行 -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- 顶部导航：站内锚点跳转 -->
  <header class="site-header">
    <a class="logo" href="#hero">我的作品集</a>
    <nav class="site-nav" aria-label="主导航">
      <a href="#about">关于我</a>
      <a href="#projects">项目</a>
      <a href="#contact">联系方式</a>
    </nav>
  </header>

  <main>
    <!-- 首屏：一句话介绍 + 引导按钮 -->
    <section id="hero" class="hero">
      <h1>你好，我是 <span class="highlight">[你的名字]</span></h1>
      <p class="tagline">一个正在学习 Web 开发、用作品说话的学习者。</p>
      <a class="cta" href="#projects">看看我的项目</a>
    </section>

    <!-- 关于我：初始页为占位文案，后续关卡补充真实信息 -->
    <section id="about" class="section">
      <h2>关于我</h2>
      <p class="placeholder">这里将写入你的个人介绍：你是谁、在学什么、想做什么。</p>
    </section>

    <!-- 项目列表：卡片占位，后续关卡填充真实项目 -->
    <section id="projects" class="section">
      <h2>项目</h2>
      <div class="cards">
        <article class="card">
          <h3>项目 1</h3>
          <p class="placeholder">一句话描述这个项目做了什么……</p>
        </article>
        <article class="card">
          <h3>项目 2</h3>
          <p class="placeholder">一句话描述这个项目做了什么……</p>
        </article>
        <article class="card">
          <h3>项目 3</h3>
          <p class="placeholder">一句话描述这个项目做了什么……</p>
        </article>
      </div>
    </section>

    <!-- 联系方式：占位邮箱与主页，后续替换为真实信息 -->
    <section id="contact" class="section">
      <h2>联系方式</h2>
      <p>邮箱：<a href="mailto:you@example.com">you@example.com</a></p>
      <p>GitHub：<a href="https://github.com/your-name" target="_blank" rel="noopener">github.com/your-name</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> [你的名字] · 由我自己构建</p>
  </footer>
</body>
</html>
